name: Compilar IPA

on:
  push:
    branches:
      - main
      - test-arm64
  workflow_dispatch:

# Un grupo por rama: la rama de pruebas no cancela ni espera a la compilacion de main. (Grupo nuevo: la ejecucion #130 se quedo
# colgada en GitHub y bloqueaba a los grupos anteriores.)
concurrency:
  group: trop-build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  build-ios:
    name: Build iOS IPA
    # main compila en el Mac Intel (el que ha funcionado siempre); la rama de pruebas, en el Mac con chip Apple.
    runs-on: ${{ github.ref_name == 'main' && 'macos-15-intel' || 'macos-15' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      # El volumen donde se compila se monta antes: asi se puede restaurar en el la cache de paquetes de Swift.
      - name: Prepare case-sensitive build volume
        run: |
          VOL="$HOME/Library/Caches/TropBuild.sparseimage"
          MNT="/Volumes/TropBuild"
          if [ ! -f "$VOL" ]; then
            hdiutil create -size 20g -type SPARSE -fs 'Case-sensitive APFS' -volname TropBuild "$VOL"
          fi
          if ! mount | grep -q " $MNT "; then
            hdiutil attach "$VOL" -mountpoint "$MNT" -nobrowse >/dev/null
          fi
          mkdir -p "$MNT/SourcePackages"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: /Volumes/TropBuild/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Build iOS IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      # El IPA que se instala sale de la release "nightly"; el artefacto es solo una copia. Se borran los antiguos (se habia
      # llenado el espacio de artefactos y la subida fallaba, saltandose la publicacion) y, aunque falle, no impide publicar.
      - name: Delete old artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null || true
          done

      - name: Upload iOS IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Trop-iOS
          path: build/Trop.ipa
          retention-days: 1

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SUBJECT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IPA_PATH="build/Trop.ipa"
          test -f "$IPA_PATH"

          # Create the floating nightly prerelease if missing, then replace the IPA asset.
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly \
              --prerelease \
              --title "Ultima compilacion" \
              --notes "IPA de la ultima compilacion correcta. Se sustituye en cada ejecucion."
          fi

          # Respaldo: antes de sustituir el IPA, se guarda el anterior como Trop-anterior.ipa.
          if gh release download nightly --pattern Trop.ipa --output Trop-anterior.ipa --clobber 2>/dev/null; then
            PREVIOUS_ID="$(gh api "repos/${{ github.repository }}/releases/tags/nightly" \
              --jq '.assets[] | select(.name == "Trop-anterior.ipa") | .id' || true)"
            if [ -n "${PREVIOUS_ID:-}" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${PREVIOUS_ID}"
            fi
            gh release upload nightly Trop-anterior.ipa --clobber
          fi

          # Remove prior Trop.ipa so upload is a clean overwrite.
          EXISTING_ASSET_ID="$(gh api "repos/${{ github.repository }}/releases/tags/nightly" \
            --jq '.assets[] | select(.name == "Trop.ipa") | .id' || true)"
          if [ -n "${EXISTING_ASSET_ID:-}" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${EXISTING_ASSET_ID}"
          fi

          gh release upload nightly "$IPA_PATH" --clobber

          NOTES="$(printf '%s' "$COMMIT_SUBJECT" | head -n 1 | tr -d '\r')"
          if [ -z "$NOTES" ]; then
            NOTES="Nightly build #${RUN_NUMBER}"
          fi
          # Single-line notes avoid breaking the YAML run block indentation.
          TIMING="$(cat build/timing.txt 2>/dev/null || true)"
          BODY="$(printf 'Latest main build (#%s). %s (real)\n\nTiempos de la compilacion:\n%s\n' "$RUN_NUMBER" "$NOTES" "$TIMING")"
          gh release edit nightly --notes "$BODY"

      # Deja el final de los registros en la rama "run-logs-<rama>" (archivos de texto): asi se puede ver por que falla una
      # compilacion sin abrir GitHub.
      - name: Save the logs of this run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p runlogs
          cp build/timing.txt runlogs/timing.txt 2>/dev/null || true
          RESOLVE_LOG="$(find build -name resolve.log 2>/dev/null | head -n 1)"
          if [ -n "$RESOLVE_LOG" ]; then tail -n 80 "$RESOLVE_LOG" > runlogs/resolve-tail.txt; fi
          BUILD_LOG="$(find build -name xcodebuild.log 2>/dev/null | head -n 1)"
          if [ -n "$BUILD_LOG" ]; then tail -n 150 "$BUILD_LOG" > runlogs/xcodebuild-tail.txt; fi
          {
            echo "runner: ${{ runner.os }} ${{ runner.arch }} | rama ${{ github.ref_name }} | commit ${{ github.sha }} | ejecucion ${{ github.run_number }}"
            sw_vers
            xcodebuild -version
          } > runlogs/info.txt 2>&1 || true
          WORK="$(mktemp -d)"
          cp runlogs/* "$WORK/"
          cd "$WORK"
          git init -q
          git checkout -q -b "run-logs-$BRANCH"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Registros de la ejecucion ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "run-logs-$BRANCH"
